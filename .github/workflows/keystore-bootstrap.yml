name: Android Permanent Keystore Bootstrap & Vault Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 선택 (init-once / verify)'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - init-once

jobs:
  keystore-vault:
    name: Manage Permanent Android Signing Key Vault
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate selected mode
        shell: bash
        env:
          SELECTED_MODE: ${{ inputs.mode || github.event.inputs.mode }}
        run: |
          echo "Selected mode: ${SELECTED_MODE}"
          if [ "$SELECTED_MODE" != "verify" ] && [ "$SELECTED_MODE" != "init-once" ]; then
            echo "ERROR: Invalid mode '$SELECTED_MODE'. Expected 'verify' or 'init-once'."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21 (for keytool)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify existing permanent keystore restoration
        if: ${{ (inputs.mode || github.event.inputs.mode) == 'verify' }}
        env:
          KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BACKUP_REPO: ${{ secrets.ANDROID_KEYSTORE_BACKUP_REPO }}
          KEYSTORE_BACKUP_TOKEN: ${{ secrets.KEYSTORE_BACKUP_TOKEN }}
          ANDROID_KEYSTORE_ENC_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENC_BASE64 }}
        run: |
          node scripts/android-keystore-restore.mjs "$RUNNER_TEMP/verify-keystore.jks"
          rm -f "$RUNNER_TEMP/verify-keystore.jks"
          echo "Permanent Android keystore restoration & keytool verification PASSED."

      - name: Initialize permanent keystore ONCE & upload AES-256-GCM backup to PRIVATE vault repo
        if: ${{ (inputs.mode || github.event.inputs.mode) == 'init-once' }}
        env:
          KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BACKUP_REPO: ${{ secrets.ANDROID_KEYSTORE_BACKUP_REPO }}
          KEYSTORE_BACKUP_TOKEN: ${{ secrets.KEYSTORE_BACKUP_TOKEN }}
          ANDROID_KEYSTORE_ENC_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENC_BASE64 }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const backupRepo = (process.env.ANDROID_KEYSTORE_BACKUP_REPO || '').trim();
          const token = (process.env.KEYSTORE_BACKUP_TOKEN || '').trim();
          const encBase64 = (process.env.ANDROID_KEYSTORE_ENC_BASE64 || '').trim();
          const vaultTag = 'keystore-vault';
          const assetName = 'lovelytalk-release.jks.enc';

          if (encBase64) {
            throw new Error(
              'ANDROID_KEYSTORE_ENC_BASE64 secret is already configured. Refusing init-once to protect existing signing key.'
            );
          }

          if (!backupRepo || !token) {
            throw new Error('ANDROID_KEYSTORE_BACKUP_REPO and KEYSTORE_BACKUP_TOKEN secrets are required for init-once.');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'User-Agent': 'LovelyTalk-Keystore-Bootstrap',
          };

          async function run() {
            // 1. Verify target backup repository is strictly PRIVATE
            const repoRes = await fetch(`https://api.github.com/repos/${backupRepo}`, { headers });
            if (!repoRes.ok) {
              throw new Error(`Cannot access backup repo "${backupRepo}" (HTTP ${repoRes.status}).`);
            }
            const repoInfo = await repoRes.json();
            if (repoInfo.private !== true) {
              throw new Error(`SECURITY ABORT: "${backupRepo}" is NOT private! Refusing to upload keystore backup.`);
            }

            // 2. Refuse to overwrite if vault release or keystore asset already exists
            let existingRelease = null;
            const existingRes = await fetch(
              `https://api.github.com/repos/${backupRepo}/releases/tags/${encodeURIComponent(vaultTag)}`,
              { headers }
            );
            if (existingRes.ok) {
              existingRelease = await existingRes.json();
              if ((existingRelease.assets || []).some((a) => a.name === assetName)) {
                throw new Error(
                  `Permanent keystore backup "${assetName}" ALREADY EXISTS in "${backupRepo}". Refusing to generate or overwrite signing key!`
                );
              }
            }

            // 3. Generate permanent keystore once & encrypt with AES-256-GCM
            const tmpJks = path.join(process.env.RUNNER_TEMP, 'lovelytalk-release.jks');
            const tmpEnc = path.join(process.env.RUNNER_TEMP, assetName);
            execFileSync('node', ['scripts/android-keystore-manager.mjs', 'init', tmpJks, tmpEnc], {
              stdio: 'inherit',
            });

            // 4. Create vault release in PRIVATE repo & upload encrypted backup
            let release = existingRelease;
            if (!release) {
              const createRes = await fetch(`https://api.github.com/repos/${backupRepo}/releases`, {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  tag_name: vaultTag,
                  name: 'LovelyTalk Permanent Android Keystore Vault (AES-256-GCM)',
                  body: 'Private encrypted backup of the permanent Android release signing key. Do NOT delete or make this repository public.',
                  draft: false,
                  prerelease: false,
                }),
              });
              if (!createRes.ok) {
                throw new Error(`Failed to create vault release: HTTP ${createRes.status}`);
              }
              release = await createRes.json();
            }

            const uploadBase = release.upload_url.replace(/\{.*$/, '');
            const encData = fs.readFileSync(tmpEnc);
            const upRes = await fetch(`${uploadBase}?name=${encodeURIComponent(assetName)}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/octet-stream',
                'User-Agent': 'LovelyTalk-Keystore-Bootstrap',
              },
              body: encData,
            });
            if (!upRes.ok) {
              throw new Error(`Failed to upload encrypted keystore backup: HTTP ${upRes.status}`);
            }

            fs.rmSync(tmpJks, { force: true });
            fs.rmSync(tmpEnc, { force: true });
            console.log(`[keystore-bootstrap] Encrypted permanent keystore safely stored in PRIVATE repo "${backupRepo}" (${vaultTag}).`);
          }

          run().catch((err) => {
            console.error('[keystore-bootstrap] ERROR:', err.message);
            process.exit(1);
          });
          EOF

      - name: Cleanup temporary files
        if: always()
        run: rm -f "$RUNNER_TEMP/lovelytalk-release.jks" "$RUNNER_TEMP/lovelytalk-release.jks.enc" "$RUNNER_TEMP/verify-keystore.jks"
