name: Web Build & Lockfile Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web-build:
    name: Verify Lockfile, Version Sync, TypeScript & Vite Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package.json and package-lock.json consistency (npm ci)
        run: npm ci

      - name: Verify unified version consistency across Web, Android, and Windows
        run: npm run version:verify

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run Vite production web build
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Compile Electron TypeScript sources (sanity check)
        run: npm run electron:compile
