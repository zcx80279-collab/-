name: Build & Release Installable Apps (Android APK & Windows EXE)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '정식 GitHub Release 생성 여부 (기본 false: 테스트용 Artifact만 업로드)'
        required: false
        default: false
        type: boolean
      release_notes:
        description: '릴리스 변경 사항 메모 (비워두면 자동 생성)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Version, Tag & Lockfile
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      should_release: ${{ steps.meta.outputs.should_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package.json & package-lock.json match (npm ci --dry-run)
        run: npm ci --dry-run

      - name: Validate SemVer, Android versionCode, tag match & anti-downgrade
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf8')).version)")
          VERSION_CODE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf8')).androidVersionCode)")
          TAG_NAME="v${VERSION}"

          SHOULD_RELEASE="false"
          if [ "$EVENT_NAME" = "push" ]; then
            SHOULD_RELEASE="true"
            node scripts/version-manager.mjs verify --tag "$REF_NAME" --check-remote
          elif [ "$INPUT_PUBLISH" = "true" ]; then
            SHOULD_RELEASE="true"
            node scripts/version-manager.mjs verify --tag "$TAG_NAME" --check-remote
          else
            node scripts/version-manager.mjs verify
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Signed Android Release APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build production web assets
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore permanent Android release signing key (AES-256-GCM)
        env:
          KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BACKUP_REPO: ${{ secrets.ANDROID_KEYSTORE_BACKUP_REPO }}
          KEYSTORE_BACKUP_TOKEN: ${{ secrets.KEYSTORE_BACKUP_TOKEN }}
          ANDROID_KEYSTORE_ENC_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENC_BASE64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/android-keystore-restore.mjs "$RUNNER_TEMP/lovelytalk-release.jks"

      - name: Build Android signed Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lovelytalk-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK exists, is signed with release cert, and generate android-latest.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: Expected signed Release APK not found at $APK_SOURCE"
            exit 1
          fi

          mkdir -p dist-android
          cp "$APK_SOURCE" dist-android/LovelyTalk-Android.apk

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner tool not found in Android SDK build-tools."
            exit 1
          fi

          CERT_INFO=$("$APKSIGNER" verify --verbose --print-certs dist-android/LovelyTalk-Android.apk)
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -qi "Android Debug"; then
            echo "ERROR: APK is signed with Android Debug key! Permanent release key is required."
            exit 1
          fi

          node scripts/generate-android-metadata.mjs dist-android/LovelyTalk-Android.apk dist-android/android-latest.json

          test -s dist-android/LovelyTalk-Android.apk
          test -s dist-android/android-latest.json

      - name: Wipe temporary decrypted keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/lovelytalk-release.jks"

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifact
          path: |
            dist-android/LovelyTalk-Android.apk
            dist-android/android-latest.json
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64 NSIS Installer EXE
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build production web assets
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Compile Electron main & preload
        run: npm run electron:compile

      - name: Build Windows x64 NSIS EXE & electron-updater metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --config electron-builder.config.cjs --publish never

      - name: Verify Windows EXE, blockmap & latest.yml exist and match
        shell: bash
        run: |
          test -s release-windows/LovelyTalk-Windows-Setup.exe
          test -s release-windows/LovelyTalk-Windows-Setup.exe.blockmap
          test -s release-windows/latest.yml
          grep -q "LovelyTalk-Windows-Setup.exe" release-windows/latest.yml
          cat release-windows/latest.yml

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifact
          path: |
            release-windows/LovelyTalk-Windows-Setup.exe
            release-windows/LovelyTalk-Windows-Setup.exe.blockmap
            release-windows/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Verify All Artifacts & Publish Atomic GitHub Release
    needs: [validate, build-android, build-windows]
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifact
          path: release-bundle

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifact
          path: release-bundle

      - name: Verify all 5 release artifacts & cryptographic hashes
        run: node scripts/verify-release-assets.mjs release-bundle "${{ needs.validate.outputs.version }}"

      - name: Atomically create Draft Release, upload all assets, verify, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const token = process.env.GH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.TAG_NAME;
          const version = process.env.VERSION;
          const versionCode = process.env.VERSION_CODE;
          const customNotes = (process.env.CUSTOM_NOTES || '').trim();

          const files = [
            'LovelyTalk-Android.apk',
            'android-latest.json',
            'LovelyTalk-Windows-Setup.exe',
            'LovelyTalk-Windows-Setup.exe.blockmap',
            'latest.yml',
          ];

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'User-Agent': 'LovelyTalk-Atomic-Releaser',
          };

          async function run() {
            const body = [
              `## 러비러비톡 (Lovely Talk) ${tag}`,
              '',
              customNotes || `- 버전: \`${tag}\` (Android versionCode: \`${versionCode}\`)\n- Android APK 및 Windows x64 설치 파일(EXE) 정식 배포\n- 기존 채팅 기록, 캐릭터 설정, 나의 분신 데이터를 유지한 채 업데이트 가능합니다.`,
              '',
              '### 포함 파일',
              '- `LovelyTalk-Android.apk` (영구 서명 키 적용 Android 설치 파일)',
              '- `LovelyTalk-Windows-Setup.exe` (Windows x64 NSIS 설치 파일)',
              '- `latest.yml` & `LovelyTalk-Windows-Setup.exe.blockmap` (Windows 자동 업데이트 메타데이터)',
              '- `android-latest.json` (Android 업데이트 확인 및 SHA-256 무결성 검증 메타데이터)',
            ].join('\n');

            // 1. Create DRAFT release first so incomplete release is NEVER publicly visible
            const createRes = await fetch(`https://api.github.com/repos/${repo}/releases`, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                tag_name: tag,
                name: `러비러비톡 ${tag}`,
                body,
                draft: true,
                prerelease: false,
                generate_release_notes: customNotes.length === 0,
              }),
            });

            if (!createRes.ok) {
              throw new Error(`Failed to create draft release: HTTP ${createRes.status} ${await createRes.text()}`);
            }

            const draftRelease = await createRes.json();
            const releaseId = draftRelease.id;
            const uploadBase = draftRelease.upload_url.replace(/\{.*$/, '');

            try {
              // 2. Upload every required file
              for (const fileName of files) {
                const filePath = path.join('release-bundle', fileName);
                const data = fs.readFileSync(filePath);
                const uploadRes = await fetch(`${uploadBase}?name=${encodeURIComponent(fileName)}`, {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/octet-stream',
                    'User-Agent': 'LovelyTalk-Atomic-Releaser',
                  },
                  body: data,
                });
                if (!uploadRes.ok) {
                  throw new Error(`Asset upload failed for ${fileName}: HTTP ${uploadRes.status}`);
                }
                console.log(`[release] Uploaded ${fileName} (${data.length} bytes)`);
              }

              // 3. Re-fetch draft release to verify ALL 5 assets are uploaded completely
              const checkRes = await fetch(`https://api.github.com/repos/${repo}/releases/${releaseId}`, { headers });
              const verifiedRelease = await checkRes.json();
              const uploadedNames = new Set(
                (verifiedRelease.assets || [])
                  .filter((a) => a.state === 'uploaded' && a.size > 0)
                  .map((a) => a.name)
              );

              for (const requiredFile of files) {
                if (!uploadedNames.has(requiredFile)) {
                  throw new Error(`Verification failed: asset "${requiredFile}" is missing from draft release.`);
                }
              }

              // 4. Publish release (draft -> false) ONLY after 100% verification passes
              const pubRes = await fetch(`https://api.github.com/repos/${repo}/releases/${releaseId}`, {
                method: 'PATCH',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({ draft: false }),
              });
              if (!pubRes.ok) {
                throw new Error(`Failed to publish release: HTTP ${pubRes.status}`);
              }
              const published = await pubRes.json();
              console.log(`[release] Published official release ${tag}: ${published.html_url}`);
            } catch (err) {
              // Clean up incomplete draft so half-baked releases never remain
              await fetch(`https://api.github.com/repos/${repo}/releases/${releaseId}`, {
                method: 'DELETE',
                headers,
              }).catch(() => {});
              throw err;
            }
          }

          run().catch((err) => {
            console.error('[release] FATAL:', err.message);
            process.exit(1);
          });
          EOF
